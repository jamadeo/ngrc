[package]
name = "ngrc"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
description = "A minimal coding agent built with the Goose GDK"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
goose-agent = { path = "../goose/crates/goose-agent" }
goose-provider-types = { path = "../goose/crates/goose-provider-types" }
goose-providers = { path = "../goose/crates/goose-providers", features = ["rustls-tls"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["schemars", "server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time"] }
tokio-util = "0.7"
