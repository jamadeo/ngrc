[package]
name = "ngrc"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
description = "A minimal shell-only coding agent built with the Goose GDK"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
goose-agent = "=0.1.0-alpha.12"
goose-provider-types = "=0.1.0-alpha.12"
goose-providers = { version = "=0.1.0-alpha.12", features = ["rustls-tls"] }
rmcp = { version = "=3.4.1", default-features = false, features = ["schemars", "server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time"] }
tokio-util = "0.7"
